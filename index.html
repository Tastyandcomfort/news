<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty & Comfort | T&C Live News & Media Portal</title>
  
  <!-- FontAwesome & Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(51, 65, 85, 0.6);
      --accent-blue: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* Header Styling matching main T&C website */
    .tc-header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 9999;
    }
    .tc-brand { display: flex; align-items: center; gap: 12px; }
    .tc-logo-badge {
      background: linear-gradient(135deg, #0284c7, #0f172a);
      border: 1px solid var(--accent-blue);
      color: #fff;
      font-weight: 900;
      font-size: 0.9rem;
      padding: 6px 10px;
      border-radius: 8px;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .tc-brand-title { font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .live-dot { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); display: inline-block; }

    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: #1e293b; color: var(--text-sub); border: 1px solid var(--card-border);
      padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn.active, .tab-btn:hover { background: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); }

    /* Main Container */
    .main-layout { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; flex-grow: 1; max-width: 1600px; margin: 0 auto; width: 100%; }
    @media (max-width: 1024px) { .main-layout { grid-template-columns: 1fr; } }

    /* Media Player Container */
    .media-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #000; }
    .video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }
    
    .channel-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .ch-btn {
      background: #0f172a; color: var(--text-sub); border: 1px solid var(--card-border);
      padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .ch-btn.active { background: var(--accent-gold); color: #0f172a; font-weight: 800; }

    /* News Controls & Container */
    .news-card-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .news-header-tools { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
    
    .scope-selector { display: flex; gap: 6px; }
    .scope-btn { background: #0f172a; color: var(--text-sub); border: 1px solid var(--card-border); padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .scope-btn.active { background: var(--accent-blue); color: #0f172a; font-weight: bold; }

    .date-picker-input { background: #0f172a; color: var(--text-main); border: 1px solid var(--card-border); padding: 5px 8px; border-radius: 6px; font-size: 0.75rem; }

    .news-grid { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    
    /* Branded News Cards */
    .news-item {
      background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px; transition: transform 0.2s, border-color 0.2s;
    }
    .news-item:hover { border-color: var(--accent-blue); transform: translateY(-1px); }
    .news-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: var(--text-sub); }
    .news-title { font-size: 0.88rem; font-weight: 600; color: #fff; text-decoration: none; line-height: 1.4; }
    
    .tc-source-tag {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(56, 189, 248, 0.15); color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3); padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; text-decoration: none; width: fit-content;
    }
    .tc-source-tag:hover { background: var(--accent-blue); color: #0f172a; }

    /* Telemetry Sidebar & Map */
    .sidebar-panel { display: flex; flex-direction: column; gap: 12px; }
    .panel-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; }
    
    #osint-map { width: 100%; height: 260px; border-radius: 8px; background: #0f172a; }

    /* Footer */
    .tc-footer { background: #060911; border-top: 1px solid var(--card-border); padding: 20px; margin-top: auto; font-size: 0.75rem; color: var(--text-sub); }
    .footer-content { max-width: 1600px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  </style>
</head>
<body>

  <!-- T&C Branded Header -->
  <header class="tc-header">
    <div class="tc-brand">
      <div class="tc-logo-badge">T&C</div>
      <div class="tc-brand-title">LIVE NEWS & GLOBAL MEDIA</div>
      <span class="live-dot" style="margin-left: 6px;"></span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('all')"><i class="fa-solid fa-newspaper"></i> News & Streams</button>
      <button class="tab-btn" onclick="switchView('osint')"><i class="fa-solid fa-satellite-dish"></i> OSINT Desk</button>
    </div>
  </header>

  <!-- Main View -->
  <div class="main-layout">
    
    <!-- Left Section: Stream & Categorized News -->
    <div style="display: flex; flex-direction: column; gap: 16px;">
      
      <!-- Live Video Stream -->
      <div class="media-card">
        <div class="video-wrapper">
          <iframe id="main-player" src="https://www.youtube.com/embed/II_m28Bm-iM?autoplay=1&mute=1" allowfullscreen></iframe>
        </div>
        
        <div class="channel-bar">
          <button class="ch-btn active" onclick="playChannel('II_m28Bm-iM', this)">🔴 TV9 Live</button>
          <button class="ch-btn" onclick="playChannel('IzOOvR-XzAg', this)">🔴 NTV News</button>
          <button class="ch-btn" onclick="playChannel('s8V3t68Hl2Y', this)">🔴 V6 News</button>
          <button class="ch-btn" onclick="playChannel('OKQEMp2555A', this)">🛰️ NASA Space Live</button>
          <button class="ch-btn" onclick="playChannel('n4I0d44oBEs', this)">✈️ Airside Aviation</button>
        </div>
      </div>

      <!-- News Engine -->
      <div class="news-card-box">
        <div class="news-header-tools">
          <div class="scope-selector">
            <button class="scope-btn active" id="scope-local" onclick="setScope('local')">Telangana</button>
            <button class="scope-btn" id="scope-national" onclick="setScope('national')">India</button>
            <button class="scope-btn" id="scope-world" onclick="setScope('world')">World</button>
          </div>
          <input type="date" id="news-date-picker" class="date-picker-input" onchange="onDateFilterChange(this.value)">
        </div>

        <div class="news-grid" id="news-feed-container">
          <!-- News Cards loaded dynamically -->
        </div>
      </div>

    </div>

    <!-- Right Sidebar: Clean OSINT Telemetry Map (No API Key Required) -->
    <div class="sidebar-panel">
      
      <div class="panel-box">
        <div style="font-size: 0.8rem; font-weight: 800; color: var(--accent-blue); margin-bottom: 8px;">
          🛰️ REAL-TIME SEISMIC OSINT RADAR
        </div>
        <div id="osint-map"></div>
      </div>

      <div class="panel-box">
        <div style="font-size: 0.8rem; font-weight: 800; color: var(--accent-gold); margin-bottom: 8px;">
          🛰️ ISS ORBIT & SPACE TELEMETRY
        </div>
        <div style="font-size: 0.75rem; display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between;"><span>ISS Speed:</span><b id="iss-speed" style="color:var(--accent-blue);">-- km/h</b></div>
          <div style="display: flex; justify-content: space-between;"><span>ISS Altitude:</span><b id="iss-alt" style="color:var(--accent-blue);">-- km</b></div>
          <div style="display: flex; justify-content: space-between;"><span>Astronaut Manifest:</span><b id="iss-crew" style="color:var(--accent-green);">7 Crew Active</b></div>
        </div>
      </div>

    </div>

  </div>

  <!-- T&C Footer -->
  <footer class="tc-footer">
    <div class="footer-content">
      <div><b>Tasty & Comfort (T&C) Media Portal</b> • Verified Real-Time Feeds</div>
      <div>© 2026 Tasty & Comfort. All Rights Reserved.</div>
    </div>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let currentScope = 'local';
    let map = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Set today's date in picker
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('news-date-picker').value = today;

      initCleanMap();
      fetchNewsFeed();
      initISSTelemetry();
    });

    // 1. Watermark-Free CartoDB Dark Matter Map Initialization
    function initCleanMap() {
      map = L.map('osint-map').setView([20.5937, 78.9629], 3);

      // Clean tile layer with NO API key requirement and NO watermark
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 18
      }).addTo(map);

      // Fetch Real-Time USGS Earthquakes
      fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson')
        .then(r => r.json())
        .then(data => {
          (data.features || []).slice(0, 10).forEach(q => {
            const [lon, lat, depth] = q.geometry.coordinates;
            const mag = q.properties.mag;
            L.circleMarker([lat, lon], {
              radius: Math.max(4, mag * 2),
              color: mag > 6 ? '#ef4444' : '#f59e0b',
              fillColor: mag > 6 ? '#ef4444' : '#f59e0b',
              fillOpacity: 0.8
            }).bindPopup(`<b>M ${mag} Earthquake</b><br>${q.properties.place}`).addTo(map);
          });
        })
        .catch(() => {});
    }

    // 2. Branded News Fetcher
    async function fetchNewsFeed(targetDate = null) {
      const container = document.getElementById('news-feed-container');
      container.innerHTML = '<div style="font-size:0.75rem; color:#94a3b8;">Syncing T&C news feeds...</div>';

      try {
        const dateParam = targetDate ? `&date=${targetDate}` : '';
        const res = await fetch(`https://news-lemon-two.vercel.app/api/news?scope=${currentScope}${dateParam}`);
        const xmlText = await res.text();
        const xml = new DOMParser().parseFromString(xmlText, "text/xml");
        const items = xml.querySelectorAll("item");

        if (items.length === 0) {
          container.innerHTML = `<div style="font-size:0.75rem; color:#94a3b8;">No articles found for selected date.</div>`;
          return;
        }

        let html = '';
        items.forEach((item, index) => {
          if (index > 12) return;
          const title = item.querySelector("title")?.textContent || "Headline update";
          const link = item.querySelector("link")?.textContent || "#";
          const pubDate = item.querySelector("pubDate")?.textContent || "";
          
          // Deduce Source Name
          let sourceName = "T&C News";
          if (link.includes("tv9")) sourceName = "TV9 Telugu";
          else if (link.includes("ntv")) sourceName = "NTV News";
          else if (link.includes("hindu")) sourceName = "The Hindu";
          else if (link.includes("ndtv")) sourceName = "NDTV";
          else if (link.includes("bbc")) sourceName = "BBC News";

          html += `
            <div class="news-item">
              <div class="news-meta">
                <span>${pubDate ? new Date(pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Live Update'}</span>
              </div>
              <a href="${link}" target="_blank" class="news-title">${title}</a>
              <a href="${link}" target="_blank" class="tc-source-tag">
                <i class="fa-solid fa-circle-check"></i> ${sourceName} • View Story
              </a>
            </div>
          `;
        });
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<div style="font-size:0.75rem; color:#ef4444;">Unable to load news feed. Check connection.</div>`;
      }
    }

    function setScope(scope) {
      currentScope = scope;
      document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`scope-${scope}`).classList.add('active');
      fetchNewsFeed();
    }

    function onDateFilterChange(val) {
      fetchNewsFeed(val);
    }

    function playChannel(videoId, btnEl) {
      document.getElementById('main-player').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;
      document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
    }

    function initISSTelemetry() {
      setInterval(async () => {
        try {
          const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
          const data = await res.json();
          document.getElementById('iss-speed').textContent = `${Math.round(data.velocity).toLocaleString()} km/h`;
          document.getElementById('iss-alt').textContent = `${parseFloat(data.altitude).toFixed(1)} km`;
        } catch(e) {}
      }, 5000);
    }

    function switchView(view) {
      // Toggle tabs UI
    }
  </script>
</body>
</html>
