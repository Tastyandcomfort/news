name: 🚀 T&C Platform - Developer Broadcast

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification Title'
        required: true
        default: 'T&C Platform • Developer Update 🚀'
      message:
        description: 'Update Details (What did you add/optimize?)'
        required: true
        default: 'New update released: Added Notification Customization & Live Job Portal!'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Broadcast to All Users
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BROADCAST_TITLE: ${{ github.event.inputs.title }}
          BROADCAST_MESSAGE: ${{ github.event.inputs.message }}
        run: node send-developer-broadcast.js

        
