name: Auto-Update Official Most Wanted Feed

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wanted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch NIA, INTERPOL & FBI Wanted Data
        run: node scripts/update-wanted.mjs

      - name: Commit updated wanted-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wanted-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync official most wanted feed"
            git push
          else
            echo "No changes in wanted-data.json"
          fi
