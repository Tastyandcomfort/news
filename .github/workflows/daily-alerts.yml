
# =========================================================
# =========================================================
#  TIME CHEAT SHEET (IST to GitHub UTC):
#  7:00 AM IST   ->  '30 1 * * *'
#  8:00 AM IST   ->  '30 2 * * *'
#  10:00 AM IST  ->  '30 4 * * *'
#  12:00 PM IST  ->  '30 6 * * *'
#  2:00 PM IST   ->  '30 8 * * *'
#  4:00 PM IST   ->  '30 10 * * *'
#  6:00 PM IST   ->  '30 12 * * *'
#  7:00 PM IST   ->  '30 13 * * *'
#  9:00 PM IST   ->  '30 15 * * *'
#  10:00 PM IST  ->  '30 16 * * *'

# =========================================

#  name: Daily Scheduled News Notifications
#  on:
#  schedule:
#    - cron: '30 2 * * *'   # 8:00 AM IST
#    - cron: '30 6 * * *'   # 12:00 PM IST
#    - cron: '30 10 * * *'  # 4:00 PM IST
#    - cron: '30 15 * * *'  # 9:00 PM IST
#  workflow_dispatch:
#  =======================================
#  The first number is always 30 (for sharp hours like 8:00, 12:00, 4:00).
#  Just subtract 5 hours and 30 minutes from your IST time:
#  8:00 AM minus 5:30 = 2:30 👉 '30 2 * * *'
#  4:00 PM (16:00) minus 5:30 = 10:30 👉 '30 10 * * *'
#  9:00 PM (21:00) minus 5:30 = 15:30 👉 '30 15 * * *'
# =========================================================
# =========================================================


name: Daily Scheduled News Notifications

on:
  schedule:
    # Runs 4 times a day in IST (UTC + 5:30)
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST
    - cron: '30 10 * * *'  # 4:00 PM IST
    - cron: '30 15 * * *'  # 9:00 PM IST
  workflow_dispatch:      # Enables the manual test button

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Send Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-notification.js
